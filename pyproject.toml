[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace"
version = "0.1.0"
description = "Advect tracer particles through simulation-snapshot velocity fields and record their thermodynamic histories."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Max Jacobi", email = "max.jacobi@freenet.de" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.7",
    "tqdm>=4.64",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "analysis*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
